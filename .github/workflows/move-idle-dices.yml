name: Move Idle-dices to root
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-idle-dices.yml']
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move files without changing their contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          prefix = 'Idle-dices/'
          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', prefix])
          sources = [os.fsdecode(p) for p in raw.split(b'\0') if p]
          if not sources:
              raise SystemExit('No tracked files found in Idle-dices; stopping.')
          moves = [(src, src[len(prefix):]) for src in sources]
          for src, dst in moves:
              if os.path.lexists(dst):
                  raise SystemExit('Destination already exists: ' + dst)
              for parent in Path(dst).parents:
                  if parent != Path('.') and os.path.lexists(parent) and not parent.is_dir():
                      raise SystemExit('Destination parent is not a directory: ' + str(parent))
          for src, dst in moves:
              Path(dst).parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git', 'mv', '--', src, dst], check=True)
          PY
          git rm -- .github/workflows/move-idle-dices.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Move all Idle-dices contents to repository root'
          git push origin HEAD:main

name: Restore and verify Idle Dice data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-game.yml']
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore matching original JSON files
        run: |
          python3 - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          base = 'https://raw.githubusercontent.com/Luts91/Luts91.github.io/37eea0d4c482ca7c95e965b1569369a9ad236f94/idle-dices/data/'
          expected = {'changelog.json': 'e225e499f8a7ac811c152d6b74d094110e2b4c01', 'config.json': '5283b69cf046e0de2c32974b264006b74b2d0bff', 'preload.json': '512d0250e2a26be3deb5e62951164eebbb581826', 'text.json': '64963dc508bd6eb8005d2812793956fdf3c82e3b'}
          Path('data').mkdir(exist_ok=True)
          for name, sha in expected.items():
              target = Path('data') / name
              if target.exists():
                  raise SystemExit('Refusing to overwrite existing file: ' + str(target))
              with urllib.request.urlopen(base + name, timeout=60) as response:
                  content = response.read()
              actual = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              if actual != sha:
                  raise SystemExit('Original file hash mismatch: ' + name)
              json.loads(content)
              target.write_bytes(content)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Build preview with project-site path
        run: |
          mkdir -p _preview/Wtv
          cp index.html _preview/Wtv/
          cp -R js assets data _preview/Wtv/
          for file in manifest.json service-worker.js .nojekyll; do
            if [ -f "$file" ]; then cp "$file" _preview/Wtv/; fi
          done
      - name: Test game startup
        run: |
          node <<'JS'
          const fs = require('fs');
          const { spawn } = require('child_process');
          const { chromium } = require('playwright');
          (async () => {
            const report = { url: 'http://127.0.0.1:8000/Wtv/', errors: [], missingFiles: [], passed: false };
            const server = spawn('python3', ['-m', 'http.server', '8000', '--bind', '127.0.0.1', '--directory', '_preview'], { stdio: 'ignore' });
            let browser;
            try {
              await new Promise(r => setTimeout(r, 1500));
              browser = await chromium.launch({ args: ['--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });
              const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
              page.on('pageerror', e => report.errors.push(e.stack || e.message));
              page.on('response', r => {
                const u = new URL(r.url());
                if (u.origin === 'http://127.0.0.1:8000' && r.status() >= 400 && !['/Wtv/cordova.js', '/favicon.ico'].includes(u.pathname)) report.missingFiles.push({ url: r.url(), status: r.status() });
              });
              await page.goto(report.url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(20000);
              report.canvas = await page.evaluate(() => {
                const c = document.querySelector('canvas');
                if (!c) return null;
                const image = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
                const colors = new Set();
                for (let i = 0; i < image.length; i += 256) colors.add([image[i], image[i+1], image[i+2], image[i+3]].join(','));
                return { width: c.width, height: c.height, sampledColors: colors.size };
              });
              report.passed = report.errors.length === 0 && report.missingFiles.length === 0 && !!report.canvas && report.canvas.sampledColors > 5;
            } catch (e) { report.testError = e.stack || e.message; }
            finally { if (browser) await browser.close(); server.kill(); }
            fs.writeFileSync('repair-report.json', JSON.stringify(report, null, 2));
          })().catch(e => { console.error(e); process.exit(1); });
          JS
      - name: Publish browser test result and gate repair
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('repair-report.json', 'utf8');
            const report = JSON.parse(text);
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'Game repair verification report', body: 'Browser startup test of restored files at the /Wtv/ path. This is a local test, not confirmation of live deployment or admin-panel functionality.\n\n```json\n' + text + '\n```' });
            if (!report.passed) core.setFailed('Browser startup test failed; no data commit or repair deployment performed.');
      - name: Commit restored data and remove temporary repair workflow
        run: |
          set -euo pipefail
          git add -- data/changelog.json data/config.json data/preload.json data/text.json
          git rm -- .github/workflows/repair-game.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore missing original Idle Dice data files'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _preview/Wtv
      - id: deployment
        uses: actions/deploy-pages@v4

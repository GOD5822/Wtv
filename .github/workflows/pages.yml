name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare complete game site
        run: |
          set -euo pipefail
          test -s index.html
          test -s js/app.js
          test -s data/config.json
          test -s data/preload.json
          mkdir -p _site
          cp index.html _site/
          cp -R js assets data _site/
          for file in manifest.json service-worker.js .nojekyll; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

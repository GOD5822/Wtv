name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare game site
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s js/app.js
          test -d assets
          mkdir -p _site
          cp index.html _site/
          cp -R js assets _site/
          for file in manifest.json service-worker.js .nojekyll; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4

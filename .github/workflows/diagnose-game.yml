name: Diagnose game black screen
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-game.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser diagnostic tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Inspect game startup
        shell: bash
        run: |
          node <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const report = { url: 'https://god5822.github.io/Wtv/', errors: [], console: [], failedRequests: [], badResponses: [] };
            for (const file of ['index.html', 'manifest.json', 'service-worker.js']) {
              if (fs.existsSync(file)) report[file] = fs.readFileSync(file, 'utf8');
            }
            const browser = await chromium.launch({ args: ['--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });
            try {
              const context = await browser.newContext({ viewport: { width: 1280, height: 800 } });
              const page = await context.newPage();
              page.on('pageerror', e => { if (report.errors.length < 20) report.errors.push(e.stack || e.message); });
              page.on('console', m => { if (report.console.length < 30) report.console.push({ type: m.type(), text: m.text().slice(0, 2000) }); });
              page.on('requestfailed', r => { if (report.failedRequests.length < 30) report.failedRequests.push({ url: r.url(), failure: r.failure() }); });
              page.on('response', r => { if (r.status() >= 400 && report.badResponses.length < 30) report.badResponses.push({ url: r.url(), status: r.status() }); });
              const response = await page.goto(report.url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              report.status = response && response.status();
              await page.waitForTimeout(20000);
              report.page = await page.evaluate(() => ({ title: document.title, text: document.body.innerText.slice(0, 3000), scripts: Array.from(document.scripts, s => s.src), canvases: Array.from(document.querySelectorAll('canvas'), c => ({ width: c.width, height: c.height, display: getComputedStyle(c).display, bounds: c.getBoundingClientRect().toJSON() })), webglAvailable: !!document.createElement('canvas').getContext('webgl') }));
              await page.screenshot({ path: 'game-diagnostic.png', fullPage: true });
            } catch (e) { report.diagnosticError = e.stack || e.message; }
            finally { await browser.close(); }
            fs.writeFileSync('game-diagnostic.md', '# Game startup diagnostic report\n\n```json\n' + JSON.stringify(report, null, 2).slice(0, 55000) + '\n```\n');
          })().catch(e => { console.error(e); process.exit(1); });
          JS
      - name: Publish diagnostic report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'Game black-screen diagnostic report', body: fs.readFileSync('game-diagnostic.md', 'utf8') });
      - name: Save diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-browser-diagnostic
          path: |
            game-diagnostic.png
            game-diagnostic.md
          if-no-files-found: ignore
